name: JARVIS Build
on: [push, pull_request]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: android-actions/setup-android@v3
   - run: yes | sdkmanager --licenses >/dev/null || true
   - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: '8.11.1'}
   - run: gradle :app:testDebugUnitTest --stacktrace
   - run: gradle :app:assembleDebug --stacktrace
   - run: gradle :app:assembleRelease --stacktrace
   - name: Static project checks
     run: |
       test -f settings.gradle.kts
       test -f app/build.gradle.kts
       test -f app/src/main/AndroidManifest.xml
       grep -q 'versionName = "1.53.1"' app/build.gradle.kts
       grep -q 'versionCode = 53' app/build.gradle.kts
       python3 - <<'PY2'
       import xml.etree.ElementTree as ET
       ET.parse("app/src/main/AndroidManifest.xml")
       ET.parse("app/src/main/res/xml/network_security_config.xml")
       ET.parse("app/src/main/res/xml/voice_interaction_service.xml")
       print("XML checks passed")
       PY2
