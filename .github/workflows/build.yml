name: JARVIS Build
on: [push, pull_request]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: android-actions/setup-android@v3
     with:
       # setup-android defaults to the obsolete SDK package `tools`; disable that default.
       packages: ''
   - name: Install Android SDK packages
     run: |
       set -euo pipefail
       yes | sdkmanager --licenses >/dev/null || true
       sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
       sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-36|build-tools;36.0.0'
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: '8.11.1'}
   - run: gradle :app:testDebugUnitTest --stacktrace
   - run: gradle :app:assembleDebug --stacktrace
   - run: gradle :app:assembleRelease --stacktrace
   - name: Static project checks
     run: |
       test -f settings.gradle.kts
       test -f app/build.gradle.kts
       test -f app/src/main/AndroidManifest.xml
       grep -q 'versionName = "1.53.4"' app/build.gradle.kts
       grep -q 'versionCode = 56' app/build.gradle.kts
       python3 - <<'PY2'
       from pathlib import Path
       import re
       bad = []
       for p in Path('.github/workflows').glob('*.y*ml'):
           for n, line in enumerate(p.read_text().splitlines(), 1):
               if re.search(r'^\s*packages\s*:.*\btools\b', line, re.I) or re.search(r'^\s*sdkmanager\b.*[\"\']tools[\"\']', line, re.I):
                   bad.append(f'{p}:{n}')
       if bad:
           raise SystemExit('Obsolete Android SDK package tools requested: ' + ', '.join(bad))
       print('SDK workflow check passed')
       PY2
       if grep -RIn -E 'com\.jarvis\.nextgen\.(voice|automation|system|proactive|tools)\.' app/src/main app/src/test; then echo 'Stale flattened-package references found'; exit 1; fi
       python3 - <<'PY2'
       import xml.etree.ElementTree as ET
       ET.parse("app/src/main/AndroidManifest.xml")
       ET.parse("app/src/main/res/xml/network_security_config.xml")
       ET.parse("app/src/main/res/xml/voice_interaction_service.xml")
       print("XML checks passed")
       PY2
